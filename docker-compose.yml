# ============================================================
# Docker Phase 3 — Full Stack
# Frontend (nginx) + Backend (Flask) + PostgreSQL
# Everything runs in Docker. Nothing needs to run locally.
# ============================================================
#
# Start everything:  docker compose up --build
# Stop everything:   docker compose down
# Rebuild one:       docker compose up --build backend
# View logs:         docker compose logs -f backend
# ============================================================

services:

  # ─────────────────────────────────────────────────────────
  # 1. PostgreSQL Database
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: autodeploy_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AutoDeploy123}
      POSTGRES_DB: ${POSTGRES_DB:-autodeploy}

    ports:
      - "5432:5432"     # exposed so you can still connect from host (psql CLI, pgAdmin)

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbadmin} -d ${POSTGRES_DB:-autodeploy}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app_network


  # ─────────────────────────────────────────────────────────
  # 2. Flask Backend
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: autodeploy_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # ⚠️ CRITICAL: use service name "postgres" NOT "localhost"
      # Inside Docker, localhost = the backend container itself
      # "postgres" = the postgres service on the shared Docker network
      DATABASE_URL: postgresql://${POSTGRES_USER:-dbadmin}:${POSTGRES_PASSWORD:-AutoDeploy123}@postgres:5432/${POSTGRES_DB:-autodeploy}

      # EC2_KEY_DIR tells SSHClient where to look for .pem files inside the container.
      # The volume mount below places the key at /app/backend/<keyname>.pem.
      # EC2_KEY_DIR: /app/backend

    ports:
      - "5000:5000"     # exposed so browser can reach API directly if needed

    depends_on:
      postgres:
        condition: service_healthy   # wait for postgres to be ready before starting

    # ── SSH key for EC2 deployments ────────────────────────────────────────────
    # The PEM file must exist on the host BEFORE running `docker compose up`.
    # Create it first:  touch backend/ml-deploy-key.pem && chmod 600 backend/ml-deploy-key.pem
    # Then paste your AWS key pair content into it.
    # For ECS Fargate: do NOT use a volume. Instead inject the key via
    # AWS Secrets Manager and reference it in the Task Definition secrets block.
    volumes:
      - ./backend/ml-deploy-key.pem:/app/ml-deploy-key.pem:ro
      - ~/.aws:/home/appuser/.aws:ro
    networks:
      - app_network


  # ─────────────────────────────────────────────────────────
  # 3. React Frontend (nginx)
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: autodeploy_frontend
    restart: unless-stopped

    ports:
      - "80:80"         # access the app at http://localhost (no port number needed)

    environment:
      # Must match the service name on the Docker network so nginx envsubst
      # can build the upstream: proxy_pass http://backend:5000
      BACKEND_HOST: backend
      BACKEND_PORT: "5000"

    depends_on:
      - backend         # nginx proxies /api/* to backend — backend must be up first

    networks:
      - app_network


# ─────────────────────────────────────────────────────────
# Shared Docker network
# All containers on this network can talk to each other by service name
# postgres:5432, backend:5000 etc.
# ─────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge


# ─────────────────────────────────────────────────────────
# Persistent volume for PostgreSQL data
# ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
