# ============================================================
# Docker Phase 3 — Full Stack
# Frontend (nginx) + Backend (Flask) + PostgreSQL
# Everything runs in Docker. Nothing needs to run locally.
# ============================================================
#
# Start everything:  docker compose up --build
# Stop everything:   docker compose down
# Rebuild one:       docker compose up --build backend
# View logs:         docker compose logs -f backend
# ============================================================

services:

  # ─────────────────────────────────────────────────────────
  # 1. PostgreSQL Database
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: autodeploy_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"     # exposed so you can still connect from host (psql CLI, pgAdmin)

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app_network


  # ─────────────────────────────────────────────────────────
  # 2. Flask Backend
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: autodeploy_backend
    restart: unless-stopped

    environment:
      # ⚠️ CRITICAL: use service name "postgres" NOT "localhost"
      # Inside Docker, localhost = the backend container itself
      # "postgres" = the postgres service on the shared Docker network
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}

      # PEM key path (override in ECS via Secrets Manager mount)
      PEM_KEY_PATH: ${PEM_KEY_PATH:-/app/ml-deploy-key.pem}

      # Flask settings
      FLASK_ENV: ${FLASK_ENV:-production}
      APP_PORT: ${APP_PORT:-5000}

      # CORS / Frontend origin
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}

      # AWS — NO access keys here.
      # On ECS Fargate: boto3 auto-fetches short-lived credentials from the
      # IAM Task Role via the container metadata endpoint (169.254.170.2).
      # For LOCAL dev: run `aws configure` once on the host; boto3 picks it up.
      AWS_REGION: ${AWS_REGION}
      AWS_KEY_PAIR_NAME: ${AWS_KEY_PAIR_NAME}
      EC2_AMI_ID: ${EC2_AMI_ID}
      EC2_INSTANCE_TYPE: ${EC2_INSTANCE_TYPE}
      EC2_VOLUME_SIZE: ${EC2_VOLUME_SIZE}
      SECURITY_GROUP_NAME: ${SECURITY_GROUP_NAME}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-1}

      # ── First-admin bootstrap ─────────────────────────────────────────
      # Set these once to auto-create the admin account on first startup.
      # After the account is created these values are ignored (idempotent).
      # In production store these in AWS Secrets Manager as JSON:
      #   { "ADMIN_EMAIL": "...", "ADMIN_PASSWORD": "..." }
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"     # exposed so browser can reach API directly if needed

    depends_on:
      postgres:
        condition: service_healthy   # wait for postgres to be ready before starting

    volumes:
      # ⚠️  Destination must match PEM_KEY_PATH env var exactly
      - ./backend/ml-deploy-key.pem:/app/ml-deploy-key.pem:ro
      
    networks:
      - app_network


  # ─────────────────────────────────────────────────────────
  # 3. React Frontend (nginx)
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: autodeploy_frontend
    restart: unless-stopped

    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "5000"

    ports:
      - "${NGINX_HTTP_PORT:-80}:80"       # access the app at http://localhost

    depends_on:
      - backend         # nginx proxies /api/* to backend — backend must be up first

    networks:
      - app_network


# ─────────────────────────────────────────────────────────
# Shared Docker network
# All containers on this network can talk to each other by service name
# postgres:5432, backend:5000 etc.
# ─────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge


# ─────────────────────────────────────────────────────────
# Persistent volume for PostgreSQL data
# ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
