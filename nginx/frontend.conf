# ⚠️  WARNING: This file is NOT used at runtime.
# The active config is generated from frontend.conf.template at container startup:
#   envsubst '${BACKEND_HOST} ${BACKEND_PORT}' < frontend.conf.template > /etc/nginx/conf.d/default.conf
#
# The ${BACKEND_HOST} and ${BACKEND_PORT} variables below are raw shell syntax that
# nginx CANNOT resolve natively. Nginx will try to connect to a literal host named
# "${BACKEND_HOST}" and fail. Always use frontend.conf.template — not this file.
#
# This file exists only as a readable reference. Do not copy it into any deployment.

server {
    listen 80;
    server_name _;  # catch-all — works behind ECS ALB with any domain/IP

    # Serve the built React/Vite app
    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router — all paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend container
    # ${BACKEND_HOST} is substituted at container startup by envsubst (see Dockerfile.frontend).
    # Docker Compose:      BACKEND_HOST=backend   (service name on Docker network)
    # ECS same-task:       BACKEND_HOST=localhost  (sidecar — shares network namespace)
    # ECS separate tasks:  BACKEND_HOST=<Cloud Map / Service Connect DNS name>
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (socket.io) to backend
    location /socket.io/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
